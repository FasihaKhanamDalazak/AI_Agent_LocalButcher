services:
  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    # No ports: mapping here on purpose — Caddy (below) is the only thing
    # that should be reachable from outside the VM; the app itself stays
    # on the internal Docker network.
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      - backend

networks:
  internal:

volumes:
  caddy_data:
  caddy_config:
